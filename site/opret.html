    if(q.sens)h+='<span class="sens">Det her er en sundhedsrelateret oplysning. Du giver samtykke til den i sidste trin, og kan trække det tilbage.</span>';
    if(q.type==='date'){
      h+='<div class="fieldset"><div class="field"><label class="lab" for="f-dob">Fødselsdato</label><p class="hint">Skriv bare 8 cifre i træk, fx 14031988. Punktummerne sættes automatisk.</p><input type="text" inputmode="numeric" id="f-dob" autocomplete="bday" placeholder="DD.MM.ÅÅÅÅ" maxlength="10" aria-describedby="wsum e-dob"><p class="wsum" id="wsum" role="status" aria-live="polite"></p><div class="err" id="e-dob" role="alert"></div></div></div>';
    } else if(q.key==='relation'){
      function ropt(o,i,dest){var id='o-'+q.key+'-'+i,chosen=S.a[q.key]===o;return '<label class="opt2" for="'+id+'"><input type="radio" id="'+id+'" name="'+q.key+'" value="'+i+'"'+(chosen?' checked':'')+'><span class="card"><span class="mark" aria-hidden="true"></span><span class="txt"><strong>'+esc(o)+'</strong>'+(dest?'<span class="dest">\u2192 Du sendes til nyhedsbrevssiden. Der oprettes ikke en profil.</span>':'')+'</span></span></label>';}
      h+='<div class="grp"><p class="grph" id="g1">Fællesskabet: opret profil</p><div class="opts" role="radiogroup" aria-labelledby="g1" style="margin-top:8px;">'+ropt(q.opts[0],0,false)+'</div></div>';
      h+='<div class="grp"><p class="grph" id="g2">Ikke selv bipolar? Nyhedsbrev</p><p class="grpt">Fællesskabet er lige nu kun for mennesker med bipolar. Du er stadig velkommen til at følge med.</p><div class="opts" role="radiogroup" aria-labelledby="g2" style="margin-top:8px;">'+ropt(q.opts[1],1,true)+ropt(q.opts[2],2,true)+ropt(q.opts[3],3,true)+'</div></div>';
    } else {
      h+='<div class="opts" role="'+(q.type==='multi'?'group':'radiogroup')+'" aria-label="'+esc(q.title)+'">';
      q.opts.forEach(function(o,i){
        var chosen=q.type==='multi'?S.a[q.key].indexOf(o)>-1:S.a[q.key]===o;
        var id='o-'+q.key+'-'+i,type=q.type==='multi'?'checkbox':'radio';
        var inner,cls='opt2'+(q.type==='multi'?' multi':'')+(q.land&&i<3?' land':'');
        if(q.land&&i<3){
          var m=o.match(/^\S+\s+(\S+):\s*(.*)$/),img=['lasse-orken','lasse-skov','lasse-bjerg'][i];
          inner='<span class="card"><img src="mitlivmed_assets/'+img+'.jpg" alt=""><span class="body"><span class="mark" aria-hidden="true"></span><span class="txt"><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span><span class="fit"><b>Måske er du her, hvis:</b> '+esc(FIT[m[1]])+'</span></span></span></span>';
        } else inner='<span class="card"><span class="mark" aria-hidden="true"></span><span class="txt"><strong>'+esc(o)+'</strong></span></span>';
        h+='<label class="'+cls+'" for="'+id+'"><input type="'+type+'" id="'+id+'" name="'+q.key+'" value="'+i+'"'+(chosen?' checked':'')+'>'+inner+'</label>';
      });
      h+='</div>';
    }
    return h+'<div id="qerr" class="err" role="alert" style="margin-top:12px;"></div>'+nav({skip:!q.req});
  }
  function consent(){
    function c(k,tag,title,txt,req){return '<label class="consent'+(S.c[k]?' on':'')+'"><input type="checkbox" data-c="'+k+'"'+(S.c[k]?' checked':'')+'><span class="tag">'+tag+'</span><strong>'+title+'</strong><span>'+txt+'</span></label>';}
    return '<h1>Dine samtykker</h1><p class="why">Her giver du kun samtykke til det, du selv vil. De tre første er nødvendige for at oprette en profil. Det sidste er valgfrit. Ingen er afkrydset på forhånd.</p>'+
    c('health','Påkrævet','Jeg giver mit udtrykkelige samtykke til behandling af mine sundhedsrelaterede oplysninger','Det gælder fx din relation til bipolar og dit landskab. Dine svar kan kun ses af dig og vores administratorer. Du kan trække samtykket tilbage når som helst. Læs mere i <a href="privatlivspolitik.html#helbredsoplysninger" target="_blank" rel="noopener">privatlivspolitikken, afsnit 3</a>.')+
    c('terms','Påkrævet','Jeg accepterer brugerbetingelserne','Du skal være mindst 18 år. <a href="brugerbetingelser.html" target="_blank" rel="noopener">Læs brugerbetingelserne</a>.')+
    c('privacy','Påkrævet','Jeg har læst privatlivspolitikken','<a href="privatlivspolitik.html" target="_blank" rel="noopener">Læs privatlivspolitikken</a>.')+
    c('marketing','Valgfrit','Jeg vil gerne have nyt fra MitLivMed i min indbakke','Ja, MitLivMed må sende mig e-mails om nye produkter, funktioner, indhold og tilbud og sende mig påmindelser, hvis jeg begynder på en tilmelding, men ikke gør den færdig. <a href="markedsfoeringspolitik.html" target="_blank" rel="noopener">Læs markedsføringspolitikken</a>.')+
    '<div id="cerr" class="err" role="alert" style="margin-top:12px;"></div>'+nav({label:'Opret profil'});
  }
  /* Sender profilen til API'et (MLM-2557). Adgangskoden læses fra kontotrinnet og sendes kun i selve forespørgslen over HTTPS. */
  var sending=false;
  function submit(btn){
    if(sending)return;
    if(!window.MLM){el('cerr').textContent='Siden kunne ikke indlæses helt. Genindlæs siden, og prøv igen.';return;}
    sending=true;btn.disabled=true;var label=btn.innerHTML;btn.textContent='Opretter din profil …';
    var a=S.a,body={email:S.account.email,username:S.account.username,password:S.account.password,
      gender:a.gender,birthDate:a.birth_date,relation:a.relation,landscape:a.landscape,
      info:a.info,events:a.events,
      consents:{health:S.c.health,terms:S.c.terms,privacy:S.c.privacy,marketing:S.c.marketing}};
    if(a.need)body.need=a.need;
    var hp=el('f-website');if(hp&&hp.value)body.website=hp.value;
    MLM.api.post('/api/community/signup',body).then(function(){
      MLM.track('form_submit',{form_id:'opret'});
      S.account.password='';sending=false;go(cur+1);
    }).catch(function(err){
      sending=false;btn.disabled=false;btn.innerHTML=label;
      var code=err&&err.code,status=err&&err.status;
      var fe=err&&err.body&&err.body.details&&err.body.details.fieldErrors||{};
      if(fe.username){go(0);el('e-user').textContent=userErr(S.account.username)||'Brugernavnet er ikke tilladt. Vælg et andet.';el('f-user').focus();return;}
      if(fe.password){go(0);el('e-pw').textContent='Adgangskoden skal være 10-200 tegn.';el('f-pw').focus();return;}
      if(fe.email){go(0);el('e-email').textContent='Skriv en gyldig e-mailadresse.';el('f-email').focus();return;}
      if(code==='username_unavailable'){go(0);el('e-user').textContent='Brugernavnet er optaget eller ikke tilladt. Vælg et andet.';el('f-user').focus();return;}
      if(code==='invalid_password'){go(0);el('e-pw').textContent='Adgangskoden blev ikke godkendt. Vælg en længere eller mindre almindelig adgangskode.';el('f-pw').focus();return;}
      el('cerr').textContent=status===429?'Du har prøvet flere gange på kort tid. Vent lidt, og prøv igen.'
        :'Det lykkedes ikke at oprette profilen. Prøv igen, eller skriv til kontakt@mitlivmed.dk.';
    });
  }
  function done(){
    return '<h1>Tjek din indbakke</h1><p class="why">Vi har sendt en e-mail til <strong>'+esc(S.account.email)+'</strong>. Klik på linket i den for at aktivere din profil. Kan du ikke finde den, så kig i din spam-mappe.</p>'+
    '<p class="why">Når profilen er aktiveret, kan du logge ind i fællesskabet.</p>'+
    '<div class="nav2"><a class="btn" href="https://xn--fllesskab-g3a.mitlivmed.dk/login">Gå til log ind →</a></div>';
  }
  function go(n){cur=n;render();window.scrollTo({top:0,behavior:'smooth'});}
  function wire(){
    var s=steps[cur],sc=el('screen');
    var b=sc.querySelector('[data-back]');if(b)b.addEventListener('click',function(){save();go(cur-1);});
    var sk=sc.querySelector('[data-skip]');if(sk)sk.addEventListener('click',function(){var q=Q[s.i];S.a[q.key]=q.type==='multi'?[]:'';go(cur+1);});
    var nx=sc.querySelector('[data-next]');if(nx)nx.addEventListener('click',function(){if(!validate())return;var st=steps[cur];if(st.t==='q'&&Q[st.i].key==='relation'&&S.a.relation!==Q[st.i].opts[0]){var gm={};gm[Q[st.i].opts[1]]='paaroerende';gm[Q[st.i].opts[2]]='fagperson';location.href='nyhedsbrev.html?gruppe='+(gm[S.a.relation]||'andre');return;}if(st.t==='consent'){submit(nx);return;}go(cur+1);});
    sc.querySelectorAll('input').forEach(function(i){i.addEventListener('keydown',function(e){if(e.key==='Enter'&&i.type!=='checkbox'&&i.type!=='radio'){e.preventDefault();if(validate())go(cur+1);}});});
    var pt=el('pwtoggle');if(pt)pt.addEventListener('click',function(){var f=el('f-pw'),on=f.type==='password';f.type=on?'text':'password';pt.textContent=on?'Skjul':'Vis';pt.setAttribute('aria-pressed',on);});
    if(s.t==='q'){
      var q=Q[s.i];
      sc.querySelectorAll('.opts input').forEach(function(i){i.addEventListener('change',function(){
        var idx=+i.value,o=q.opts[idx];
        if(q.type==='single')S.a[q.key]=o;
        else{var arr=S.a[q.key];
          if(i.checked){ if(q.excl&&o===q.excl)arr=[o]; else {arr=arr.filter(function(x){return x!==q.excl;});arr.push(o);} }
          else arr=arr.filter(function(x){return x!==o;});
          S.a[q.key]=arr;
          if(q.excl){sc.querySelectorAll('.opts input').forEach(function(x){x.checked=arr.indexOf(q.opts[+x.value])>-1;});}
        }
        el('qerr').textContent='';
      });});
    }
    if(s.t==='consent'){sc.querySelectorAll('[data-c]').forEach(function(i){i.addEventListener('change',function(){S.c[i.dataset.c]=i.checked;i.closest('.consent').classList.toggle('on',i.checked);el('cerr').textContent='';});});}
  }
  function save(){
    var s=steps[cur];
    if(s.t==='account'){S.account.email=el('f-email').value.trim();S.account.username=el('f-user').value.trim();S.account.password=el('f-pw').value;}
  }
  /* Discourses regler for brugernavne (standardindstillinger, se app/models/username_validator.rb). Samme regler i API'et. */
  function userErr(u){
    if(u.length<3)return 'Vælg et brugernavn på mindst 3 tegn.';
    if(u.length>20)return 'Brugernavnet må højst være 20 tegn.';
    if(/[^A-Za-z0-9._-]/.test(u))return 'Brugernavnet må kun indeholde bogstaverne a-z, tal og tegnene . _ - (ingen mellemrum og ingen æ, ø eller å).';
    if(!/^[A-Za-z0-9_]/.test(u))return 'Brugernavnet skal starte med et bogstav, et tal eller _.';
    if(!/[A-Za-z0-9]$/.test(u))return 'Brugernavnet skal slutte med et bogstav eller et tal.';
    if(/[-_.]{2,}/.test(u))return 'Brugernavnet må ikke have to af tegnene . _ - lige efter hinanden.';
    if(/\.(js|json|css|htm|html|xml|jpg|jpeg|png|gif|bmp|ico|tif|tiff|woff)$/i.test(u))return 'Brugernavnet må ikke ende på en filendelse som .png eller .json.';
    return '';
  }
  function validate(){
    var s=steps[cur],ok=true;
    if(s.t==='account'){
      save();var set=function(i,m){el(i).textContent=m;if(m)ok=false;};
      set('e-email',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.account.email)?'':'Skriv en gyldig e-mailadresse.');
      set('e-user',userErr(S.account.username));
      set('e-pw',S.account.password.length>=10?'':'Adgangskoden skal være mindst 10 tegn.');
      if(!ok){var f=document.querySelector('.err:not(:empty)');if(f){var inp=f.parentElement.querySelector('input');if(inp)inp.focus();}}
      return ok;
    }
    if(s.t==='q'){
      var q=Q[s.i];
      if(q.type==='date'){
        var d=S.a.birth_date;if(!d){el('e-dob').textContent='Skriv din fødselsdato med 8 cifre, fx 14031988.';return false;}
        var p=d.split('-').map(Number),t=new Date(),age=t.getFullYear()-p[0]-((t.getMonth()+1<p[1]||(t.getMonth()+1===p[1]&&t.getDate()<p[2]))?1:0);
        if(age<18){el('e-dob').textContent='Du skal være mindst 18 år for at oprette en profil. Fællesskabet er kun for voksne.';return false;}
        if(age>110){el('e-dob').textContent='Tjek datoen, den ser ikke rigtig ud.';return false;}
        return true;}
      if(q.req&&!S.a[q.key]){el('qerr').textContent='Vælg en mulighed for at fortsætte.';return false;}
      return true;
    }
    if(s.t==='consent'){
      var miss=[];if(!S.c.health)miss.push('sundhedssamtykket');if(!S.c.terms)miss.push('brugerbetingelserne');if(!S.c.privacy)miss.push('privatlivspolitikken');
      if(miss.length){el('cerr').textContent='Du skal markere '+miss.join(', ')+' for at oprette en profil.';return false;}
    }
    return true;
  }
  /* form_start én gang, uden feltværdier */
  var started=false;el('screen').addEventListener('focusin',function(){if(!started&&window.MLM){started=true;MLM.track('form_start',{form_id:'opret'});}});
  render();
})();
</script>
<script>
/* Alle links på siden åbner i ny fane, så oprettelsen aldrig afbrydes */
(function(){function f(){document.querySelectorAll('a[href]').forEach(function(a){if(a.getAttribute('href').charAt(0)==='#')return;a.target='_blank';a.rel='noopener';});}f();new MutationObserver(f).observe(document.body,{childList:true,subtree:true});})();
</script>
